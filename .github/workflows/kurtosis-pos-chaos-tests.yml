# Chaos Engineering Tests for Polygon PoS
#
# This workflow runs chaos engineering scenarios against a Kurtosis PoS enclave
# to validate network resilience under various failure conditions.
#
# Repositories:
#   - Kurtosis enclave: https://github.com/0xPolygon/kurtosis-pos
#   - Chaos scenarios:  https://github.com/jhkimqd/chaos-utils (scenarios/polygon-chain/)
#
# Scenario Categories (dynamically loaded from chaos-utils):
#   Container Lifecycle: rolling-validator-restart, simultaneous-validator-restart
#   Resource Stress: cpu-starved-validator, memory-pressure-validator
#   Network Partitions: validator-partition, asymmetric-network-partition, split-brain-partition
#   Network Degradation: bandwidth-throttle, progressive-network-degradation, cascading-latency-spike
#   Dependency Failures: rabbitmq-failure, latency-spike-l1-rpc, rpc-node-degradation
#   Others: checkpoint-delay-cascade, intermittent-checkpoint-failures
#
# Triggering:
#   - Manual: Use GitHub Actions UI to trigger with custom parameters
#   - Scheduled: Runs nightly at 2 AM UTC with random selection (default)
#   - Default randomly selects 3-5 scenarios for efficient testing
#   - Select "all" for comprehensive testing of all scenarios
#
# Artifacts:
#   - chaos-test-reports-{run_id}: JSON reports for each scenario
#   - kurtosis-pos-dump-{run_id}: Full enclave logs and state
#
name: kurtosis-pos-chaos

on:
  workflow_dispatch:
    inputs:
      # Component versions
      kurtosis_pos_package_version:
        type: string
        default: "1.2.6"
      heimdall_v2_version:
        type: string
        default: "0.5.3"
      bor_version:
        type: string
        default: "2.5.5"
      erigon_version:
        type: string
        default: "3.3.0"

      # Chaos testing configuration
      chaos_scenarios:
        description: Select chaos scenarios to run (see available options below)
        type: choice
        options:
          # === Random Selection ===
          - "random"                              # Randomly select 3-5 scenarios (DEFAULT)

          # === Container Lifecycle Tests ===
          - "rolling-validator-restart"           # Sequential restart
          - "simultaneous-validator-restart"      # All validators restart at once
          - "test-single-restart"                 # Single validator restart

          # === Resource Stress Tests ===
          - "cpu-starved-validator"               # Limit CPU to 50%
          - "memory-pressure-validator"           # Constrain memory to 512MB

          # === Network Partition Tests ===
          - "validator-partition"                 # Isolate validator from network
          - "asymmetric-network-partition"        # Asymmetric network split
          - "split-brain-partition"               # Split brain scenario
          - "regional-network-outage"             # Regional outage simulation

          # === Network Degradation Tests ===
          - "bandwidth-throttle"                  # Limit bandwidth
          - "progressive-network-degradation"     # Progressive network quality loss
          - "cascading-latency-spike"             # Latency increases cascade

          # === Dependency Failures ===
          - "rabbitmq-failure"                    # RabbitMQ service failure
          - "latency-spike-l1-rpc"                # L1 RPC latency spike
          - "mixed-dependency-failure"            # Multiple dependencies fail
          - "total-dependency-isolation"          # Complete dependency isolation
          - "rpc-node-degradation"                # RPC node performance degradation

          # === Other Scenarios ===
          - "checkpoint-delay-cascade"            # Checkpoint delays cascade
          - "intermittent-checkpoint-failures"    # Random checkpoint failures
          - "monitoring-stress-test"              # Monitor system under stress

          # === Combined Test Suites ===
          - "rolling-validator-restart,simultaneous-validator-restart"  # Both restart tests
          - "cpu-starved-validator,memory-pressure-validator"           # Resource tests
          - "validator-partition,split-brain-partition"                 # Partition tests

          # === Full Test Suite ===
          - "all"                                 # All chaos tests (dynamically loaded)

        # Randomly select a few scenarios by default for efficient nightly testing
        default: "random"

  schedule:
    # Run chaos tests nightly at 2 AM UTC with random scenario selection
    # Randomly selects 3-5 scenarios each night for efficient coverage over time
    - cron: '0 2 * * *'

env:
  SLACK_CHANNEL_ID: C09UY6RJ38U

permissions:
  contents: read
  actions: write
  id-token: write

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      scenarios: ${{ steps.scenarios.outputs.scenarios_json }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup chaos-utils
        uses: ./.github/actions/setup-chaos-utils
        with:
          chaos_utils_version: "main"
          go_version: "1.24"

      - name: Determine scenarios to run
        id: scenarios
        run: |
          input="${{ inputs.chaos_scenarios }}"

          cd /tmp/chaos-utils/scenarios/polygon-chain

          # Handle different input options
          if [[ "$input" == "all" ]]; then
            echo "Discovering all available scenarios from chaos-utils repo..."
            scenarios=$(ls -1 *.yaml 2>/dev/null | sed 's/\.yaml$//' | paste -sd ',' - || echo "")

            if [[ -z "$scenarios" ]]; then
              echo "❌ No scenario files found in chaos-utils/scenarios/polygon-chain/"
              exit 1
            fi

            echo "Found $(echo "$scenarios" | tr ',' '\n' | wc -l) scenarios"
          elif [[ "$input" == "random" ]]; then
            echo "Randomly selecting scenarios from chaos-utils repo..."
            all_scenarios=$(ls -1 *.yaml 2>/dev/null | sed 's/\.yaml$//' || echo "")

            if [[ -z "$all_scenarios" ]]; then
              echo "❌ No scenario files found in chaos-utils/scenarios/polygon-chain/"
              exit 1
            fi

            # Randomly select 3-5 scenarios
            num_scenarios=$((RANDOM % 3 + 3))
            total_available=$(echo "$all_scenarios" | wc -l)

            # If we have fewer scenarios available, use all of them
            if [[ $total_available -lt $num_scenarios ]]; then
              num_scenarios=$total_available
            fi

            scenarios=$(echo "$all_scenarios" | shuf -n $num_scenarios | paste -sd ',' -)
            echo "Randomly selected $num_scenarios scenarios from $total_available available"
          else
            scenarios="$input"
          fi

          echo "scenarios=${scenarios}" >> "${GITHUB_OUTPUT}"

          # Convert comma-separated scenarios to JSON array for matrix strategy
          scenarios_json=$(echo "$scenarios" | tr ',' '\n' | jq -R . | jq -s -c .)
          echo "scenarios_json=${scenarios_json}" >> "${GITHUB_OUTPUT}"

          echo "Running scenarios: ${scenarios}"
          echo "Scenarios JSON: ${scenarios_json}"

  chaos-test:
    runs-on: ubuntu-latest
    needs: setup
    if: ${{ needs.setup.outputs.scenarios != '[]' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false  # Continue running other tests even if one fails
      max-parallel: 1  # Run tests sequentially to avoid enclave conflicts
      matrix:
        scenario: ${{ fromJson(needs.setup.outputs.scenarios) }}
    steps:
      - uses: actions/checkout@v6

      - name: Prepare environment
        uses: ./.github/actions/kurtosis-pre-run
        with:
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_token: ${{ secrets.DOCKER_TOKEN }}
          kurtosis_package_type: kurtosis-pos
          kurtosis_package_version: ${{ inputs.kurtosis_pos_package_version }}

      - name: Customize args file
        run: |
          args_file="${{ github.workspace }}/kurtosis-pos/.github/configs/rio.yml"

          if [[ "${{ inputs.heimdall_v2_version }}" ]]; then
            for i in 0 1 2 3 4; do
              yq --yaml-roundtrip --in-place ".polygon_pos_package.participants[$i].cl_image = \"0xpolygon/heimdall-v2:${{ inputs.heimdall_v2_version }}\"" ${args_file}
            done
          fi

          if [[ "${{ inputs.bor_version }}" ]]; then
            for i in 0 1 2 4; do
              yq --yaml-roundtrip --in-place ".polygon_pos_package.participants[$i].el_image = \"0xpolygon/bor:${{ inputs.bor_version }}\"" ${args_file}
            done
          fi

          if [[ "${{ inputs.erigon_version }}" ]]; then
            yq --yaml-roundtrip --in-place ".polygon_pos_package.participants[3].el_image = \"0xpolygon/erigon:v${{ inputs.erigon_version }}\"" ${args_file}
          fi

      - name: Deploy enclave
        working-directory: kurtosis-pos
        run: |
          enclave_name="chaos-${{ matrix.scenario }}-${{ github.run_id }}"
          kurtosis run --enclave $enclave_name --args-file ${{ github.workspace }}/kurtosis-pos/.github/configs/rio.yml .
          echo "ENCLAVE_NAME=${enclave_name}" >> $GITHUB_ENV

      - name: Setup chaos-utils
        uses: ./.github/actions/setup-chaos-utils
        with:
          chaos_utils_version: "main"
          go_version: "1.24"

      - name: Run chaos test - ${{ matrix.scenario }}
        run: |
          echo "Running scenario: ${{ matrix.scenario }}"
          /usr/local/bin/chaos-runner run \
            --scenario /tmp/chaos-utils/scenarios/polygon-chain/${{ matrix.scenario }}.yaml \
            --enclave ${{ env.ENCLAVE_NAME }}

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-report-${{ matrix.scenario }}
          path: reports/${{ matrix.scenario }}.json
          if-no-files-found: warn

      - name: Collect logs and cleanup enclave
        if: always()
        uses: ./.github/actions/kurtosis-post-run
        with:
          enclave_name: ${{ env.ENCLAVE_NAME }}

  summary:
    runs-on: ubuntu-latest
    needs: [setup, chaos-test]
    if: always()
    outputs:
      failed_scenarios: ${{ steps.generate-summary.outputs.failed_scenarios }}
      test_status: ${{ steps.generate-summary.outputs.test_status }}
    steps:
      - uses: actions/checkout@v6

      - name: Download all test reports
        uses: actions/download-artifact@v4
        with:
          pattern: chaos-report-*
          path: chaos-reports/
          merge-multiple: true

      - name: Generate test summary
        id: generate-summary
        run: |
          reports_dir="chaos-reports"

          echo "## Chaos Engineering Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ -d "$reports_dir" ]] && [[ -n "$(ls -A $reports_dir/*.json 2>/dev/null)" ]]; then
            passed=0
            failed=0
            failed_scenarios=()

            for report in "$reports_dir"/*.json; do
              scenario_name=$(basename "$report" .json)
              # Check if scenario passed (adjust based on your JSON structure)
              if jq -e '.status == "passed" or .passed == true' "$report" >/dev/null 2>&1; then
                ((passed++))
                echo "- ✅ **${scenario_name}**: PASSED" >> $GITHUB_STEP_SUMMARY
              else
                ((failed++))
                failed_scenarios+=("$scenario_name")
                echo "- ❌ **${scenario_name}**: FAILED" >> $GITHUB_STEP_SUMMARY
              fi
            done

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Summary" >> $GITHUB_STEP_SUMMARY
            echo "- **Total**: $((passed + failed))" >> $GITHUB_STEP_SUMMARY
            echo "- **Passed**: $passed" >> $GITHUB_STEP_SUMMARY
            echo "- **Failed**: $failed" >> $GITHUB_STEP_SUMMARY

            # Export for Slack notification
            if [[ ${#failed_scenarios[@]} -gt 0 ]]; then
              failed_list=$(IFS=', '; echo "${failed_scenarios[*]}")
              echo "failed_scenarios=$failed_list" >> $GITHUB_OUTPUT
              echo "test_status=failed" >> $GITHUB_OUTPUT
              exit 1  # Fail the workflow if any tests failed
            else
              echo "failed_scenarios=" >> $GITHUB_OUTPUT
              echo "test_status=passed" >> $GITHUB_OUTPUT
            fi
          else
            echo "⚠️ No test reports found" >> $GITHUB_STEP_SUMMARY
            echo "failed_scenarios=" >> $GITHUB_OUTPUT
            echo "test_status=no-reports" >> $GITHUB_OUTPUT
            exit 1
          fi


  slack:
    runs-on: ubuntu-latest
    if: always()
    needs: [setup, summary]
    steps:
      - uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          method: chat.postMessage
          payload: |
            {
              "channel": "${{ env.SLACK_CHANNEL_ID }}",
              "text": "Chaos Testing - Test Summary",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Chaos Engineering Tests: ${{ needs.summary.result == 'success' && 'all tests passed ✅' || needs.summary.result == 'failure' && 'tests failed ❌' || 'tests were skipped ⚠️' }}\n- environment: kurtosis-pos\n- scenarios: ${{ inputs.chaos_scenarios }}\n${{ needs.summary.outputs.failed_scenarios != '' && format('- *failed scenarios*: {0}', needs.summary.outputs.failed_scenarios) || '' }}\n- <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|explore logs>"
                  }
                }
              ]
            }
