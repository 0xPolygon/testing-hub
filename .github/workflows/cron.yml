name: cron

on:
  schedule:
    - cron: "0 0 * * *" # Run every day at 00:00 UTC.
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  id-token: write

env:
  TEST_DURATION_MINUTES: 10

jobs:
  kurtosis-cdk-op-geth:
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack_type: rollup
          # - stack_type: sovereign-pessimistic # old sovereign environment
          - stack_type: sovereign-ecdsa-multisig # new sovereign environment
    secrets: inherit
    uses: ./.github/workflows/kurtosis-cdk-op-geth.yml
    with:
      stack_type: ${{ matrix.stack_type }}
      test_duration_minutes: ${{ env.TEST_DURATION_MINUTES }}

  kurtosis-cdk-erigon:
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack_type: rollup
          - stack_type: validium
          # - stack_type: sovereign-pessimistic # old sovereign environment
          - stack_type: sovereign-ecdsa-multisig # new sovereign environment
    secrets: inherit
    uses: ./.github/workflows/kurtosis-cdk-erigon.yml
    with:
      stack_type: ${{ matrix.stack_type }}
      test_duration_minutes: ${{ env.TEST_DURATION_MINUTES }}

  kurtosis-pos:
    secrets: inherit
    uses: ./.github/workflows/kurtosis-pos.yml
    with:
      test_duration_minutes: ${{ env.TEST_DURATION_MINUTES }}
